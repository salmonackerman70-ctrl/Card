
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Mona</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;background:#0b1120;color:white;font-family:Arial,sans-serif}
.container{max-width:750px;margin:auto}
h1{text-align:center;color:#60a5fa}
.panel{background:#172033;padding:16px;border-radius:15px;margin-bottom:15px}
input,select,button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:9px;font-size:16px}
input,select{background:#e5e7eb;color:#111}
button{background:#2563eb;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.hidden{display:none!important}
#message,#gameMessage{overflow-wrap:anywhere;color:#fbbf24}
.info{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:15px}
.card{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#334155;border-radius:9px;font-size:clamp(20px,5vw,36px);cursor:pointer;user-select:none}
.card.open{background:#dbeafe}
.card.matched{background:#166534}
.small{font-size:13px;color:#cbd5e1}
@media(min-width:550px){.grid{grid-template-columns:repeat(8,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="container">
<h1>🃏 Match Mona</h1>

<div class="panel" id="setup">
  <label>Your Name</label>
  <input id="playerName" maxlength="20" placeholder="Enter your name">

  <label>Matching Pairs</label>
  <select id="pairCount">
    <option value="15">15 Pairs (30 Cards)</option>
    <option value="30">30 Pairs (60 Cards)</option>
    <option value="50">50 Pairs (100 Cards)</option>
  </select>

  <button id="createBtn">CREATE ROOM</button>
  <hr style="border-color:#334155;margin:18px 0">

  <label>Room Code</label>
  <input id="roomInput" maxlength="6" placeholder="Enter friend's room code">
  <button id="joinBtn">JOIN ROOM</button>

  <p id="message" role="status">Connecting to Firebase...</p>
</div>

<div class="panel hidden" id="game">
  <div class="info">
    <span>Room: <b id="roomCode"></b></span>
    <span>Turn: <b id="turnName">-</b></span>
  </div>
  <p id="players"></p>
  <p id="scores"></p>
  <p id="gameMessage">Connecting...</p>
  <div class="grid" id="board"></div>
  <button id="leaveBtn">BACK TO MENU</button>
  <p class="small">Share your room code with your friend to play online.</p>
</div>
</div>

<script>
/* This message appears if Firebase cannot start. */
setTimeout(() => {
  const m = document.getElementById("message");
  if (m && m.textContent === "Connecting to Firebase...") {
    m.textContent = "Firebase did not start. Open this page online and check the internet connection.";
  }
}, 8000);
</script>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase, ref, get, set, onValue, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyANLU--8TAWQKxS96gQF8HjUGpLNOjlSb4",
  authDomain: "match-45b2f.firebaseapp.com",
  databaseURL: "https://match-45b2f-default-rtdb.firebaseio.com",
  projectId: "match-45b2f",
  storageBucket: "match-45b2f.firebasestorage.app",
  messagingSenderId: "866542436127",
  appId: "1:866542436127:web:2bcacdc99d0b5d5e373a2a"
};

const $ = id => document.getElementById(id);
let db;

try {
  const app = initializeApp(firebaseConfig);
  db = getDatabase(app);
  $("message").textContent = "Firebase connected. Create or join a room.";
} catch (e) {
  $("message").textContent = "Firebase setup error: " + e.message;
  throw e;
}

const emojis = [
"🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯",
"🦁","🐮","🐷","🐸","🐵","🐔","🐧","🐦","🐤","🦆",
"🦉","🦇","🐺","🐗","🐴","🦄","🐝","🦋","🐌","🐞",
"🐢","🐍","🦎","🐙","🦀","🐠","🐬","🐳","🦈","🐊",
"🌸","🌻","🌈","⭐","🌙","🍎","🍉","🍓","🍒","🥝"
];

let roomCode = "";
let playerNumber = 0;
let roomListener = null;
let roomData = null;
let busy = false;
let resolveTimer = null;

function message(text) {
  $("message").textContent = text;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function newCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({length:6}, () =>
    chars[Math.floor(Math.random() * chars.length)]
  ).join("");
}

function makeCards(count) {
  const selected = shuffle([...emojis]).slice(0, count);
  const cards = [];
  selected.forEach((emoji, i) => {
    cards.push({pair:i,emoji,matched:false});
    cards.push({pair:i,emoji,matched:false});
  });
  return shuffle(cards);
}

function enterRoom(code, player) {
  roomCode = code;
  playerNumber = player;
  $("setup").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("roomCode").textContent = code;

  if (roomListener) roomListener();

  roomListener = onValue(ref(db, "rooms/" + code), snap => {
    if (!snap.exists()) {
      $("gameMessage").textContent = "This room no longer exists.";
      return;
    }
    roomData = snap.val();
    render(roomData);
  }, error => {
    $("gameMessage").textContent = "Firebase error: " + error.message;
  });
}

function render(room) {
  const players = room.players || {};
  const scores = room.scores || {};

  $("players").textContent =
    "Player 1: " + (players["1"] || "Waiting") +
    " | Player 2: " + (players["2"] || "Waiting");

  $("scores").textContent =
    "Scores — " + (players["1"] || "Player 1") + ": " +
    (scores["1"] || 0) + " | " +
    (players["2"] || "Player 2") + ": " + (scores["2"] || 0);

  $("turnName").textContent = players[String(room.turn)] || "Waiting";

  if (room.status === "waiting") {
    $("gameMessage").textContent = "Waiting for your friend to join...";
  } else if (room.status === "finished") {
    const a = scores["1"] || 0;
    const b = scores["2"] || 0;
    $("gameMessage").textContent = a === b ? "It's a tie! 🤝" :
      (a > b ? players["1"] : players["2"]) + " wins! 🎉";
  } else {
    $("gameMessage").textContent =
      Number(room.turn) === playerNumber ? "Your turn!" : "Opponent's turn.";
  }

  const board = $("board");
  board.innerHTML = "";

  (room.cards || []).forEach((card, i) => {
    const el = document.createElement("div");
    el.className = "card";

    const shown = card.matched || (room.selected || []).includes(i);
    el.textContent = shown ? card.emoji : "?";
    if (card.matched) el.classList.add("matched");
    else if (shown) el.classList.add("open");

    if (!card.matched && room.status === "playing") {
      el.addEventListener("click", () => flip(i));
    }
    board.appendChild(el);
  });

  if (room.status === "playing" && (room.selected || []).length === 2) {
    scheduleResolve();
  } else {
    clearTimeout(resolveTimer);
    resolveTimer = null;
  }
}

function scheduleResolve() {
  if (resolveTimer) return;
  resolveTimer = setTimeout(async () => {
    resolveTimer = null;
    try {
      await runTransaction(ref(db, "rooms/" + roomCode), room => {
        if (!room || !room.selected || room.selected.length !== 2) return;
        const [a,b] = room.selected;
        if (room.cards[a].pair === room.cards[b].pair) return;
        room.selected = [];
        room.turn = Number(room.turn) === 1 ? 2 : 1;
        return room;
      });
    } catch (e) {
      $("gameMessage").textContent = "Turn error: " + e.message;
    }
  }, 1000);
}

async function flip(index) {
  if (busy || !roomData) return;
  busy = true;

  try {
    const result = await runTransaction(ref(db, "rooms/" + roomCode), room => {
      if (!room || room.status !== "playing") return;
      if (Number(room.turn) !== playerNumber) return;

      const selected = room.selected || [];
      const card = room.cards[index];

      if (!card || card.matched || selected.includes(index) || selected.length >= 2) return;

      room.selected = [...selected, index];

      if (room.selected.length === 2) {
        const [a,b] = room.selected;

        if (room.cards[a].pair === room.cards[b].pair) {
          room.cards[a].matched = true;
          room.cards[b].matched = true;
          room.scores = room.scores || {"1":0,"2":0};
          room.scores[String(playerNumber)] =
            (room.scores[String(playerNumber)] || 0) + 1;
          room.selected = [];

          if (room.cards.every(c => c.matched)) {
            room.status = "finished";
          }
        }
      }
      return room;
    });

    if (!result.committed) {
      $("gameMessage").textContent = "Not your turn, or that card is unavailable.";
    }
  } catch (e) {
    $("gameMessage").textContent = "Card error: " + e.message;
  } finally {
    busy = false;
  }
}

async function createRoom() {
  const name = $("playerName").value.trim();
  const count = Number($("pairCount").value);

  if (!name) {
    message("Please enter your name first.");
    return;
  }

  $("createBtn").disabled = true;
  message("Creating room...");

  try {
    let code, roomRef, available = false;

    for (let i = 0; i < 10; i++) {
      code = newCode();
      roomRef = ref(db, "rooms/" + code);
      const snap = await get(roomRef);
      if (!snap.exists()) {
        available = true;
        break;
      }
    }

    if (!available) throw new Error("Could not create a room code. Try again.");

    await set(roomRef, {
      status:"waiting",
      players:{"1":name},
      cards:makeCards(count),
      selected:[],
      turn:1,
      scores:{"1":0,"2":0},
      createdAt:Date.now()
    });

    enterRoom(code, 1);
  } catch (e) {
    message("CREATE FAILED: " + e.message);
  } finally {
    $("createBtn").disabled = false;
  }
}

async function joinRoom() {
  const name = $("playerName").value.trim();
  const code = $("roomInput").value.trim().toUpperCase();

  if (!name) {
    message("Enter your name first.");
    return;
  }

  if (!/^[A-Z0-9]{6}$/.test(code)) {
    message("Enter a valid 6-character room code.");
    return;
  }

  $("joinBtn").disabled = true;
  message("Checking room " + code + "...");

  try {
    const roomRef = ref(db, "rooms/" + code);
    const snap = await get(roomRef);

    if (!snap.exists()) {
      message("ROOM NOT FOUND. Check the code and try again.");
      return;
    }

    const room = snap.val();

    if (room.status !== "waiting") {
      message("This room is already full or the game has started.");
      return;
    }

    if (room.players && room.players["2"]) {
      message("This room already has two players.");
      return;
    }

    const result = await runTransaction(roomRef, current => {
      if (!current || current.status !== "waiting") return;
      current.players = current.players || {};
      if (current.players["2"]) return;
      current.players["2"] = name;
      current.status = "playing";
      return current;
    });

    if (!result.committed) {
      message("JOIN FAILED. The room may have been filled by someone else.");
      return;
    }

    enterRoom(code, 2);
  } catch (e) {
    message("JOIN ERROR: " + e.message);
  } finally {
    $("joinBtn").disabled = false;
  }
}

$("createBtn").addEventListener("click", createRoom);
$("joinBtn").addEventListener("click", joinRoom);

$("leaveBtn").addEventListener("click", () => {
  if (roomListener) roomListener();
  roomListener = null;
  clearTimeout(resolveTimer);
  resolveTimer = null;
  roomData = null;
  roomCode = "";
  playerNumber = 0;
  $("game").classList.add("hidden");
  $("setup").classList.remove("hidden");
  $("board").innerHTML = "";
  message("Create a room or join your friend's room.");
});
</script>
</body>
</html>
